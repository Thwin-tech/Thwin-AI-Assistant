<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THWIN AI - Gemini Powered</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #f0f2f5; }
        .header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: #2563eb; color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: white; color: #333; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .input-area { padding: 15px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0; font-size: 18px;">THWIN AI</h2>
        <small>Gemini Intelligence Engine</small>
    </div>
    <div id="chat-box">
        <div class="msg ai">မင်္ဂလာပါ MD ရှင့်။ ကျွန်မ THWIN AI အဆင့်မြှင့်တင်ပြီးပါပြီ။ T-TOE သီအိုရီနဲ့ ဆိုလာနည်းပညာတွေအပြင် တခြားဘာတွေ သိချင်ပါသလဲရှင့်။</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="ဒီမှာ ရိုက်နှိပ်မေးမြန်းပါ...">
        <button onclick="send()">Send</button>
    </div>

    <script>
        // MD ပေးထားတဲ့ API Key ကို တခါတည်း ထည့်သွင်းပေးထားပါတယ်
        const API_KEY = "AIzaSyAb36y3nV5rCLes8HFrHoryua9RsK0RwOU"; 

        async function send() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();
            if (!message) return;

            // User Message ပြသခြင်း
            chatBox.innerHTML += `<div class="msg user">${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Gemini API သို့ မေးမြန်းခြင်း
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "You are THWIN AI, an expert assistant developed by MD U Thwin Aung Win. You specialize in Thwin Theory of Everything (E=kMC) and Solar-Powered Industrial solutions. Answer this clearly: " + message }] }]
                    })
                });
                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<div class="msg ai">${aiText}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="msg ai">စိတ်မရှိပါနဲ့ MD။ Gemini Engine က အဖြေမပေးနိုင်ဖြစ်နေပါတယ်။</div>`;
                }
            } catch (e) {
                chatBox.innerHTML += `<div class="msg ai">ချိတ်ဆက်မှု အခက်အခဲရှိနေပါတယ်ရှင့်။ VPN ဖွင့်ထားဖို့ လိုအပ်နိုင်ပါတယ် MD။</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Enter ခလုတ်နှိပ်ရင် ပို့လို့ရအောင်လုပ်ခြင်း
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                send();
            }
        });
    </script>
</body>
</html>
