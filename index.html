<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThwinAI - TTOE System</title>
    <style>
        body { background-color: #0d1117; color: #58a6ff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #chat-box { width: 100%; max-width: 600px; height: 400px; border: 1px solid #30363d; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 8px; background: #161b22; }
        .msg { margin: 10px 0; padding: 8px; border-radius: 5px; }
        .user { background: #1f6feb; color: white; align-self: flex-end; text-align: right; }
        .ai { background: #21262d; color: #c9d1d9; border-left: 3px solid #238636; }
        .input-area { display: flex; width: 100%; max-width: 600px; }
        input { flex: 1; padding: 10px; border-radius: 4px 0 0 4px; border: 1px solid #30363d; background: #0d1117; color: white; }
        button { padding: 10px 20px; border: none; background: #238636; color: white; border-radius: 0 4px 4px 0; cursor: pointer; }
    </style>
</head>
<body>

    <h2>THWIN AI (TTOE BASED)</h2>
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask ThwinAI...">
        <button onclick="send()">Send</button>
    </div>

    <script>
        // သင်၏ API Key
        const API_KEY = "AIzaSyAb36y3nV5rCLes8HFrHoryua9RsK0RwOU"; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        async function send() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();

            if (!message) return;

            // User message ပြသခြင်း
            chatBox.innerHTML += `<div class="msg user"><b>You:</b> ${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                // TTOE System Instruction ကို ဤနေရာတွင် ထည့်သွင်းထားသည်
                                text: `System: You are ThwinAI, an Adaptive Intelligence System based on TTOE (Thwin Theory of Everything). 
                                Your core principles are Energy, Evolution, Pattern, Interaction, Information, and Consciousness. 
                                User Query: ${message}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;

                // AI message ပြသခြင်း
                chatBox.innerHTML += `<div class="msg ai"><b>ThwinAI:</b> ${aiResponse}</div>`;
            } catch (error) {
                chatBox.innerHTML += `<div class="msg ai" style="color:red;">Error: Connection failed.</div>`;
                console.error(error);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Enter key နှိပ်ရင် message ပို့ဖို့
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
