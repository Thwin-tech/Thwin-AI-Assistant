<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THWIN AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chat-container { height: calc(100vh - 120px); }
        .ai-bubble { background: #f1f5f9; border-radius: 20px 20px 20px 5px; border: 1px solid #e2e8f0; }
        .user-bubble { background: #2563eb; color: white; border-radius: 20px 20px 5px 20px; }
        .bg-thwin { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-thwin text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-lg mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2 rounded-lg backdrop-blur-sm">
                    <i class="fas fa-microchip text-cyan-300"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">THWIN AI</h1>
                    <p class="text-[10px] text-blue-200 uppercase tracking-tighter">Robotics & Energy Expert System</p>
                </div>
            </div>
            <div class="text-xs bg-blue-500/30 px-3 py-1 rounded-full border border-blue-400/50">
                Online
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto p-4 chat-container flex flex-col">
        <div id="chatWindow" class="flex-1 overflow-y-auto space-y-4 mb-4 pr-2">
            <div class="ai-bubble p-4 text-sm text-slate-700 max-w-[90%] shadow-sm">
                မင်္ဂလာပါ MD ရှင့်။ **Thwin AI Assistant** မှ ကြိုဆိုပါတယ်။ <br><br>
                ကျွန်မက Thwin Robotics & Energy အတွက် အထူးထုတ်လုပ်ထားတဲ့ AI ဖြစ်ပါတယ်။ <br>
                နည်းပညာပိုင်းဆိုင်ရာနဲ့ လုပ်ငန်းစီမံချက်တွေကို ဘယ်လိုကူညီပေးရမလဲရှင့်?
            </div>
        </div>

        <div class="relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-full blur opacity-25 group-focus-within:opacity-50 transition duration-1000"></div>
            <div class="relative bg-white rounded-full shadow-xl border p-2 flex items-center">
                <input type="text" id="msgInput" placeholder="AI ကို မေးမြန်းပါ..." 
                       class="flex-1 px-4 py-2 outline-none text-sm bg-transparent"
                       onkeypress="if(event.key === 'Enter') handleSend()">
                <button onclick="handleSend()" class="bg-blue-600 text-white w-10 h-10 rounded-full hover:bg-blue-700 transition flex items-center justify-center shadow-md">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        function handleSend() {
            const input = document.getElementById('msgInput');
            const window = document.getElementById('chatWindow');
            if (!input.value.trim()) return;

            // User Message
            const uDiv = document.createElement('div');
            uDiv.className = "user-bubble p-4 text-sm max-w-[85%] self-end ml-auto shadow-md animate-in fade-in slide-in-from-right-2";
            uDiv.innerText = input.value;
            window.appendChild(uDiv);

            // AI Loading state
            const loadDiv = document.createElement('div');
            loadDiv.className = "text-[10px] text-slate-400 ml-2 animate-pulse";
            loadDiv.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1"></i> AI စဉ်းစားနေပါသည်...';
            window.appendChild(loadDiv);

            // Simulate AI Response
            setTimeout(() => {
                loadDiv.remove();
                const aDiv = document.createElement('div');
                aDiv.className = "ai-bubble p-4 text-sm text-slate-700 max-w-[90%] shadow-sm animate-in fade-in slide-in-from-left-2";
                aDiv.innerHTML = `<b>THWIN AI Response:</b><br>MD ရဲ့ မေးမြန်းချက် '<i>\${input.value}</i>' ကို လက်ခံရရှိပါတယ်။ ကျွန်မတို့ရဲ့ စက်ရုပ်နည်းပညာနှင့် စွမ်းအင်ဆိုင်ရာ Database ထဲမှာ အဖြေရှာဖွေနေပါတယ်ရှင့်။`;
                window.appendChild(aDiv);
                window.scrollTop = window.scrollHeight;
            }, 1500);

            input.value = "";
            window.scrollTop = window.scrollHeight;
        }
    </script>
</body>
</html>
