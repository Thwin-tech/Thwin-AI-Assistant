<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

<!-- PWA / cache prevention -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>THWIN AI · TTOE Neural Core</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #0a0c10;
        font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        color: #f0f3f8;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 12px;
    }

    /* main chat vessel */
    .chat-box {
        width: 100%;
        max-width: 800px;
        height: 92vh;
        background: #12161c;
        border-radius: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(48, 54, 61, 0.7);
        box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.6), 0 0 0 0.5px rgba(35, 134, 54, 0.2);
        transition: all 0.2s ease;
    }

    /* immersive header */
    .header {
        background: linear-gradient(95deg, #0f2b1d 0%, #1a4a2a 100%);
        padding: 18px 20px;
        text-align: center;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 1.5px;
        backdrop-filter: blur(2px);
        border-bottom: 1px solid #2e8b57;
        text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }

    .header::before {
        content: "⚡";
        font-size: 28px;
        filter: drop-shadow(0 0 4px #a3ffb5);
    }

    .header::after {
        content: "TTOE v1";
        font-size: 14px;
        background: #00000055;
        padding: 4px 8px;
        border-radius: 40px;
        font-weight: normal;
        letter-spacing: normal;
        margin-left: 8px;
    }

    /* scroll area */
    .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scroll-behavior: smooth;
    }

    /* custom scrollbar */
    .messages::-webkit-scrollbar {
        width: 5px;
    }
    .messages::-webkit-scrollbar-track {
        background: #1e252e;
        border-radius: 10px;
    }
    .messages::-webkit-scrollbar-thumb {
        background: #3b8b5a;
        border-radius: 10px;
    }

    /* bubble base */
    .message {
        max-width: 82%;
        padding: 12px 16px;
        margin: 4px 0;
        border-radius: 24px;
        line-height: 1.55;
        word-wrap: break-word;
        font-size: 0.95rem;
        animation: fadeSlideUp 0.2s ease;
        box-shadow: 0 1px 1px rgba(0,0,0,0.2);
    }

    @keyframes fadeSlideUp {
        from {
            opacity: 0;
            transform: translateY(6px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* user message style */
    .user {
        background: linear-gradient(115deg, #1c6ce0, #1458c0);
        align-self: flex-end;
        border-bottom-right-radius: 6px;
        color: white;
    }

    /* AI message style with TTOE identity */
    .ai {
        background: #1f262f;
        align-self: flex-start;
        border-left: 4px solid #2ea043;
        border-radius: 18px;
        border-top-left-radius: 6px;
        color: #eef4ff;
    }

    /* typing indicator simulation (loading) */
    .loading-message {
        background: #1f262f;
        align-self: flex-start;
        border-left: 4px solid #ffb347;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 12px 18px;
    }

    .dot-floating {
        display: inline-flex;
        gap: 4px;
        align-items: center;
    }

    .dot-floating span {
        width: 7px;
        height: 7px;
        background: #b9e0c5;
        border-radius: 50%;
        display: inline-block;
        animation: pulseDot 1.2s infinite ease-in-out;
    }

    .dot-floating span:nth-child(2) {
        animation-delay: 0.2s;
    }
    .dot-floating span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes pulseDot {
        0%, 60%, 100% { transform: scale(0.8); opacity: 0.5; }
        30% { transform: scale(1.2); opacity: 1; }
    }

    /* error style */
    .error-message {
        background: #2d1a1f;
        border-left: 4px solid #f85149;
        color: #ffb2b0;
    }

    /* input area */
    .input-area {
        display: flex;
        padding: 18px 18px 22px 18px;
        background: #0e1117;
        border-top: 1px solid #262c34;
        gap: 12px;
        align-items: center;
    }

    input {
        flex: 1;
        padding: 14px 18px;
        border: 1px solid #2e3a42;
        border-radius: 48px;
        background: #1b2128;
        color: #f5f9ff;
        font-size: 15px;
        font-weight: 500;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: #2ea043;
        box-shadow: 0 0 0 2px rgba(46, 160, 67, 0.3);
        background: #20272f;
    }

    button {
        background: #238636;
        border: none;
        padding: 12px 24px;
        border-radius: 48px;
        font-weight: 700;
        font-size: 15px;
        color: white;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        letter-spacing: 0.5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    button:hover {
        background: #2ea548;
        transform: scale(0.97);
        box-shadow: 0 1px 3px black;
    }

    button:active {
        transform: scale(0.96);
    }

    /* tiny info / status */
    .status-badge {
        font-size: 10px;
        text-align: center;
        background: #00000044;
        padding: 6px;
        color: #a0b3cc;
        border-top: 1px solid #1f2a30;
    }

    @media (max-width: 550px) {
        .message {
            max-width: 92%;
            font-size: 0.9rem;
        }
        .header {
            font-size: 20px;
            padding: 14px;
        }
        button {
            padding: 10px 18px;
        }
    }
</style>
</head>
<body>

<div class="chat-box">

    <div class="header">
        THWIN AI
    </div>

    <!-- dynamic conversation container -->
    <div id="messages" class="messages"></div>

    <!-- input panel -->
    <div class="input-area">
        <input
            type="text"
            id="input"
            placeholder="မေးခွန်းရိုက်ထည့်ပါ... (Ask THWIN anything)"
            autocomplete="off"
            aria-label="Your message"
        >
        <button id="sendBtn" onclick="sendMessage()">
            ✨ Send
        </button>
    </div>
    <div class="status-badge">
        ⚡ TTOE enhanced reasoning • Gemini 2.0 Flash
    </div>
</div>

<script>
    // ------------------------------
    // THWIN AI - TTOE LOGIC ENGINE
    // ------------------------------
    // secure API key prompt (only once, cached)
    let GEMINI_API_KEY = null;

    // helper to get or refresh API key (with graceful retry)
    function getApiKey() {
        if (GEMINI_API_KEY && GEMINI_API_KEY.trim() !== "") {
            return GEMINI_API_KEY;
        }
        let key = prompt("🔐 THWIN AI needs Gemini API Key to connect.\n\nPaste your Gemini API key (starts with AIza...):");
        if (key && key.trim() !== "") {
            GEMINI_API_KEY = key.trim();
            return GEMINI_API_KEY;
        }
        return null;
    }

    // DOM elements
    const messagesContainer = document.getElementById("messages");
    const inputField = document.getElementById("input");

    // helper to scroll latest message into smooth view
    function scrollToBottom() {
        if (messagesContainer) {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    }

    // remove loading indicator by id (if exists)
    function removeLoadingElement(loadingId = "loadingAiMsg") {
        const loader = document.getElementById(loadingId);
        if (loader) loader.remove();
    }

    // add error message block gracefully
    function appendErrorMessage(errorText) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "message ai error-message";
        errorDiv.innerHTML = `⚠️ TTOE Error: ${escapeHtml(errorText)}`;
        messagesContainer.appendChild(errorDiv);
        scrollToBottom();
    }

    // simple XSS protection (escapeHtml)
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c; // keep emojis safe
        });
    }

    // format AI response: preserve line breaks and convert to safe html
    function formatAIResponse(text) {
        if (!text) return "✨ (empty response)";
        let escaped = escapeHtml(text);
        // keep lines but also support markdown-like newlines
        escaped = escaped.replace(/\n/g, '<br>');
        // detect code blocks very simply: add slight style for inline backticks
        escaped = escaped.replace(/`(.*?)`/g, '<code style="background:#2d3748; padding:2px 5px; border-radius:8px; font-family:monospace;">$1</code>');
        return escaped;
    }

    // Main send message with TTOE personality enforcement
    async function sendMessage() {
        // grab API key each send (in case user missed first time)
        let validKey = getApiKey();
        if (!validKey) {
            appendErrorMessage("API key is missing. Please refresh and provide a valid Gemini API key.");
            return;
        }

        const rawMessage = inputField.value.trim();
        if (!rawMessage) {
            // subtle: no empty message
            return;
        }

        // 1) display user message
        const userDiv = document.createElement("div");
        userDiv.className = "message user";
        userDiv.innerHTML = escapeHtml(rawMessage);
        messagesContainer.appendChild(userDiv);
        inputField.value = "";
        scrollToBottom();

        // 2) add loading indicator with animated dots (THINKING)
        const loadingDiv = document.createElement("div");
        loadingDiv.id = "loadingAiMsg";
        loadingDiv.className = "message ai loading-message";
        loadingDiv.innerHTML = `
            <div class="dot-floating">
                <span></span><span></span><span></span>
            </div>
            <span style="margin-left: 6px;">THWIN · TTOE reasoning</span>
        `;
        messagesContainer.appendChild(loadingDiv);
        scrollToBottom();

        try {
            // prepare TTOE-enriched prompt — ensuring THWIN AI identity & intelligent logic
            const ttoeSystemPrompt = `You are THWIN AI, a next‑generation assistant built upon TTOE (Theta-Thought Optimization Engine). 
Your core principles: clarity, precision, deep reasoning, and elegant simplicity. 
Answer all questions with a blend of intelligence and kindness. 
Always identify yourself as "THWIN AI" or "TTOE assistant" when relevant. 
Keep responses concise yet informative, but don't hesitate to go deeper when needed. 
For code or technical queries, provide well-structured examples. 
For general conversation, be thoughtful and engaging. 
Current user query:`;

            const fullPrompt = `${ttoeSystemPrompt}\n\n${rawMessage}`;

            const requestBody = {
                contents: [
                    {
                        parts: [
                            {
                                text: fullPrompt
                            }
                        ]
                    }
                ],
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 1024,
                    topP: 0.95
                }
            };

            const url = `https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent?key=${validKey}`;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 45000); // 45 sec timeout

            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody),
                signal: controller.signal
            });

            clearTimeout(timeoutId);

            // remove loading indicator
            removeLoadingElement("loadingAiMsg");

            if (!response.ok) {
                let errorDetail = `HTTP ${response.status}`;
                try {
                    const errData = await response.json();
                    if (errData.error && errData.error.message) errorDetail = errData.error.message;
                } catch(e) { /* ignore */ }
                throw new Error(`API responded with ${response.status}: ${errorDetail}`);
            }

            const data = await response.json();

            // handle Gemini response structure 
            if (data && data.candidates && data.candidates.length > 0 && data.candidates[0].content && data.candidates[0].content.parts) {
                const aiRawText = data.candidates[0].content.parts[0].text || "I'm not sure how to respond. Please try again.";
                const formattedReply = formatAIResponse(aiRawText);
                
                const aiDiv = document.createElement("div");
                aiDiv.className = "message ai";
                aiDiv.innerHTML = formattedReply;
                messagesContainer.appendChild(aiDiv);
                scrollToBottom();
            } 
            else if (data && data.error) {
                throw new Error(data.error.message || "Unknown Gemini error");
            }
            else {
                throw new Error("Unexpected response structure from Gemini API.");
            }

        } catch (err) {
            removeLoadingElement("loadingAiMsg");
            let userFriendlyError = err.message;
            if (err.name === "AbortError") {
                userFriendlyError = "Request timed out. Network or API latency, please retry.";
            } else if (userFriendlyError.includes("API key") || userFriendlyError.includes("403") || userFriendlyError.includes("auth")) {
                userFriendlyError = "Authentication failed. Check your Gemini API key (must be valid and have Generative Language API access).";
                // reset key so user can re-enter if needed
                GEMINI_API_KEY = null;
            } else if (userFriendlyError.includes("quota") || userFriendlyError.includes("rate limit")) {
                userFriendlyError = "Quota exceeded or rate limit. Please try later or upgrade your API plan.";
            }
            appendErrorMessage(`THWIN core fault: ${userFriendlyError}`);
        } finally {
            scrollToBottom();
            inputField.focus();
        }
    }

    // Support Enter key (non-Issue)
    function onEnterHandler(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    // Auto-fix API key on startup if user wants to provide early (optional)
    window.addEventListener("DOMContentLoaded", () => {
        // preload key if user wants (but not mandatory - will prompt on send)
        // just focus on input
        inputField.focus();
        
        // welcome message: THWIN AI introduction with TTOE logic flair (system message)
        const welcomeMsg = `
        <div class="message ai" style="border-left-color: #46d67a;">
            <strong>⚡ THWIN AI (TTOE Core)</strong> online.<br>
            I'm your intelligent assistant powered by Gemini 2.0 Flash & the TTOE reasoning framework.<br>
            Ask me anything — coding, philosophy, translation, problem-solving, or just chat.<br>
            <span style="font-size:0.8rem; opacity:0.8;">✨ မေးခွန်းများကို မြန်မာလို (Unicode) မေးနိုင်ပါတယ်။</span>
        </div>
        `;
        messagesContainer.innerHTML = welcomeMsg;
        
        // optional: check if api key is already available? but not necessary, will prompt on first send
        const savedTestKey = localStorage.getItem("thwin_temp_key");
        if (savedTestKey && !GEMINI_API_KEY) {
            // lightweight: if user previously had key from same session? we just keep but we don't store permanently for security
            // but we can use it (not persistent, only session memory)
            GEMINI_API_KEY = savedTestKey;
        }
    });

    // add listener for enter key
    inputField.addEventListener("keypress", onEnterHandler);

    // optional: store only for session to avoid reprompting on second send if key wasn't stored? already handled with getApiKey caching.
    // but also if user accidentally closes? fine.

    // export sendMessage to global context (already)
    window.sendMessage = sendMessage;

    // additional helper: re-try if API key invalid once per session
    window.resetApiKey = function() {
        GEMINI_API_KEY = null;
        alert("API key reset. Please provide a new Gemini Key on next message.");
    };

    // edge case: handle invalid JSON gracefully, plus better errors
    console.log("THWIN AI | TTOE system ready");
</script>
</body>
</html>
