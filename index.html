<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThwinAI - TTOE System</title>
    <style>
        body { background-color: #0d1117; color: #58a6ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #chat-box { width: 100%; max-width: 600px; height: 450px; border: 1px solid #30363d; overflow-y: auto; padding: 15px; margin-bottom: 10px; border-radius: 12px; background: #161b22; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .msg { margin: 12px 0; padding: 10px; border-radius: 8px; line-height: 1.5; }
        .user { background: #1f6feb; color: white; align-self: flex-end; text-align: right; margin-left: 20%; }
        .ai { background: #21262d; color: #c9d1d9; border-left: 4px solid #238636; margin-right: 20%; }
        .input-area { display: flex; width: 100%; max-width: 600px; gap: 5px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; outline: none; }
        input:focus { border-color: #58a6ff; }
        button { padding: 10px 25px; border: none; background: #238636; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        .status { font-size: 0.8em; margin-bottom: 10px; color: #8b949e; }
    </style>
</head>
<body>

    <h2 style="color: #f0f6fc; letter-spacing: 2px;">THWIN AI</h2>
    <div class="status">TTOE Based Adaptive Intelligence</div>
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask ThwinAI (TTOE Logic)...">
        <button onclick="send()">Send</button>
    </div>

    <script>
        // စာမျက်နှာစဖွင့်တာနဲ့ API Key တောင်းပါမယ်
        let API_KEY = prompt("ThwinAI ကို စတင်ရန် Gemini API Key ကို ရိုက်ထည့်ပါ:");
        
        if (!API_KEY) {
            alert("API Key မရှိဘဲ ThwinAI အလုပ်လုပ်နိုင်မည်မဟုတ်ပါ။ စာမျက်နှာကို Refresh ပြန်လုပ်ပြီး Key ထည့်ပါ။");
        }

        async function send() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();

            if (!message || !API_KEY) return;

            // User Message
            chatBox.innerHTML += `<div class="msg user"><b>You:</b> ${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `System Instruction: You are ThwinAI, an Adaptive Intelligence System based on TTOE (Thwin Theory of Everything). Use TTOE principles (Energy, Evolution, Pattern, Interaction, Information, Consciousness) to respond. User Query: ${message}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiResponse = data.candidates[0].content.parts[0].text;
                chatBox.innerHTML += `<div class="msg ai"><b>ThwinAI:</b> ${aiResponse}</div>`;

            } catch (error) {
                chatBox.innerHTML += `<div class="msg ai" style="color: #f85149;"><b>Error:</b> ${error.message}. (Key မှားယွင်းနေခြင်း သို့မဟုတ် Internet မရှိခြင်း ဖြစ်နိုင်ပါသည်။)</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') send();
        });
    </script>
</body>
</html>
